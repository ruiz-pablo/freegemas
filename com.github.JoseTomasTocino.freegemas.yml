id: com.github.JoseTomasTocino.freegemas
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: freegemas
finish-args:
  - --socket=x11
  - --device=dri
  - --socket=pulseaudio
modules:
  - name: sdl2
    buildsystem: autotools
    build-options:
      strip: true
      no-debuginfo: true
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL/releases/download/release-2.32.8/SDL2-2.32.8.tar.gz
        archive-type: tar-gzip
        sha256: 0ca83e9c9b31e18288c7ec811108e58bac1f1bb5ec6577ad386830eac51c787e

  - name: sdl2_image
    buildsystem: autotools
    build-options:
      strip: true
      no-debuginfo: true
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL_image/releases/download/release-2.8.8/SDL2_image-2.8.8.tar.gz
        archive-type: tar-gzip
        sha256: 2213b56fdaff2220d0e38c8e420cbe1a83c87374190cba8c70af2156097ce30a

  - name: sdl2_mixer
    buildsystem: autotools
    build-options:
      strip: true
      no-debuginfo: true
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL_mixer/releases/download/release-2.8.1/SDL2_mixer-2.8.1.tar.gz
        archive-type: tar-gzip
        sha256: cb760211b056bfe44f4a1e180cc7cb201137e4d1572f2002cc1be728efd22660

  - name: sdl2_ttf
    buildsystem: autotools
    build-options:
      strip: true
      no-debuginfo: true
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL_ttf/releases/download/release-2.24.0/SDL2_ttf-2.24.0.tar.gz
        archive-type: tar-gzip
        sha256: 0b2bf1e7b6568adbdbc9bb924643f79d9dedafe061fa1ed687d1d9ac4e453bfd

  - name: jsoncpp
    buildsystem: meson
    build-options:
      strip: true
      no-debuginfo: true
    sources:
      - type: archive
        url: https://github.com/open-source-parsers/jsoncpp/archive/refs/tags/1.9.8.tar.gz
        archive-type: tar-gzip
        sha256: 51828cf3574281d2b79ec2a1c56a9e4c20cc1103711321ea96384cffb8d2d904

  # TODO:
  #  - cleanup after build
  #  - make release build instead of debug
  #  - make sure all flathub rule are addressed
  - name: freegemas
    buildsystem: cmake
    build-options:
      strip: true
      no-debuginfo: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: dir
        path: .
